; BBLIT Remaster 1.0-beta settings. This file goes next to bugs.exe (the BIN folder).
;
; [remaster] is read when the game starts.
; [live] is re-read once per second, so you can edit it while playing.
; [levelN] overrides [live] for level N (haze* keys only).

[remaster]
; extend solid startup-logo backgrounds into the side bars without stretching
;splash_fill=1
; frame rate: 0 = display refresh rate (60, 120, 144 Hz...), -1 = nearest multiple of 30 below it, otherwise a cap
;fps=0
; MSAA anti-aliasing: 0, 2, 4, 8
;msaa=4
; gamepad: 1 = XInput (analogue movement, camera on the right stick), 0 = original handling
;xinput=1
; right-stick camera: speed (8-160) and inversion (0/1)
;cam_speed=52
;cam_invert=0
; hybrid CPUs (Zen 5 + Zen 5c, Intel P+E), Linux/Proton only: pin the game's main thread to the fast cores
;big_cores=1
; extra parts in the pool for distant characters (own buffer, in addition to the engine's); 0 = the engine's own pool
;part_extra=1024

[live]
; HUD counters: widest frame, aspect ratio x100: 178 = 16:9 (the screen edges on 16:9 and 16:10), 0 = always the screen edges, 133 = original 4:3 positions
;hud_aspect=178
; world draw distance, % of the original
draw_dist=200
; world brightness x10: 20 = exactly as on the PS1 (vertex colour 0x80 = neutral), 10 = like the PC port
;ps1_light=18
; character and item draw distance, % of the original
;actor_dist=400
; burrows (the docks level): 1 = a burrow kept awake only by actor_dist ignores a dive, as in the original; 0 = off; 2 = log only
;dive_gate=1
; looping sounds (torch fire, fuses): 1 = quiet out of earshot, back when Bugs returns; 2 = just stop; 0 = original (they play forever)
;fix_sfx=1
; the sky dome that follows the camera (the docks level: islands, sun) is drawn as a backdrop: 1 = on, 0 = like the engine does
;sky_dome=1
; shadows that fall on characters and objects (Bugs on a barrel): % of the usual pull toward the camera, 0 = off
;shadow_act=25
; ground haze: off here, enabled per level below
haze=0
; top of the haze layer relative to Bugs' feet (negative = above the feet) and its vertical softness
haze_depth=-800
haze_thick=1200
; haze on geometry grows from haze_near to haze_far, capped at haze_max %
haze_near=1800
haze_far=7500
haze_max=100
; on the sky: from haze_a0 to haze_a1 degrees below the horizon
haze_a0=0
haze_a1=5

; haze in "Wabbit on the run!" (4, 5) and "Magic Hare Blower" (7, 8): hides where the distant cliffs end
[level4]
haze=100

[level5]
haze=100

[level7]
haze=100

[level8]
haze=100
