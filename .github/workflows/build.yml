name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64 (i686)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-i686 binutils-mingw-w64-i686 zip

      - name: Build ddraw.dll
        run: ./build.sh

      - name: Package
        run: |
          VER=$(sed -n 's/^#define BB_VERSION "\(.*\)"/\1/p' src/remaster.h)
          echo "VER=$VER" >> "$GITHUB_ENV"
          mkdir -p pkg/BIN
          cp build/ddraw.dll dist/remaster.ini pkg/BIN/
          cp README.md README.ru.md LICENSE pkg/
          (cd pkg && zip -r "../BBLIT-Remaster-$VER.zip" .)
          sha256sum "BBLIT-Remaster-$VER.zip" build/ddraw.dll

      - uses: actions/upload-artifact@v4
        with:
          name: BBLIT-Remaster-${{ env.VER }}
          path: pkg/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          [ "$TAG" = "v$VER" ] || { echo "тег $TAG не совпадает с BB_VERSION $VER"; exit 1; }
          PRE=""
          case "$VER" in *-*) PRE="--prerelease" ;; esac
          gh release create "$TAG" "BBLIT-Remaster-$VER.zip" --title "BBLIT Remaster $VER" \
            --notes-file dist/release-notes.md $PRE
